name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - run: npm ci
        working-directory: frontend
      # Bindings are generated with the server tag so the build needs no GUI libraries.
      - run: wails3 generate bindings -f '-tags=server' -clean=true -ts -i ./cmd/s1s
      - name: Bindings are committed and current
        run: git diff --exit-code frontend/bindings
      - run: npm run build
        working-directory: frontend
      # R-UI-7: the built app must not load anything from the network.
      - run: npm run check:offline
        working-directory: frontend
      - run: go vet ./...
      # R-SCN-14: the scenario pages in the docs are generated, and must match the scenario folders.
      - name: Scenario docs are current
        run: go run ./tools/docgen -check
      - run: go test -tags server ./...
      # R-LANG-2: everything under internal/ except the Wails shell is pure Go.
      - name: Core builds without cgo
        run: CGO_ENABLED=0 go build $(go list ./internal/... | grep -v /internal/gui)
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: npm run check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
