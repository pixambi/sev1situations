# Kept small on purpose (R-LANG-4). The default "standard" set already covers
# errcheck, govet, staticcheck, unused and ineffassign. The extras below enforce
# the rules the project cares about: wrapped errors and documented packages.
version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - revive
  settings:
    errcheck:
      # A failed write to the terminal is not something the CLI can act on.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: package-comments
        - name: exported

formatters:
  enable:
    - gofmt
